name: Site checks

on:
  push:
    branches:
      - main
      - redesign/pauze-2.0
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check pauze-2.js
      - name: Validate site wiring
        run: node scripts/check-site.mjs
